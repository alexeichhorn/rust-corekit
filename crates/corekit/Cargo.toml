[package]
name = "corekit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small Rust ergonomics library for backend projects."
repository = "https://github.com/alexeichhorn/rust-corekit"
readme = "../../README.md"

[dependencies]
corekit-macros.workspace = true
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "test-util", "time"] }
ui_test = "0.30.5"

[[test]]
name = "singleton_ui"
path = "tests/singleton_ui.rs"
harness = false

[[test]]
name = "secret_string_ui"
path = "tests/secret_string_ui.rs"
harness = false

[[test]]
name = "env_config_ui"
path = "tests/env_config_ui.rs"
harness = false

[[test]]
name = "retry_ui"
path = "tests/retry_ui.rs"
harness = false
